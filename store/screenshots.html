<!doctype html>
<!-- Source for the store screenshots (1280x800). Open with ?shot=1|3; make-screenshots.ps1 renders
     screenshot-1.png from shot 1 (speed, Music sound) and screenshot-2.png from shot 3 (in the player).
     The settings panel is the real one (panel.html). The video picture is an abstract gradient. -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; background: #0d0d0f; }
  body { position: relative; font-family: "Segoe UI Variable Display", "Segoe UI", Roboto, Arial, sans-serif; color: #f4f4f5;
    background: radial-gradient(90% 110% at 0% 0%, rgba(255,31,69,.2), transparent 55%), #0d0d0f; }
  .left { position: absolute; left: 82px; top: 50%; transform: translateY(-50%); width: 600px; }
  .eyebrow { color: #ff1f45; font-size: 22px; font-weight: 600; margin-bottom: 22px; }
  h1 { font-size: 58px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.06; }
  h1 em { font-style: normal; color: #ff1f45; }
  ul { list-style: none; margin-top: 38px; display: grid; gap: 18px; }
  li { position: relative; padding-left: 28px; font-size: 22px; line-height: 1.35; color: #d4d4d8; }
  li::before { content: ""; position: absolute; left: 4px; top: 11px; width: 9px; height: 9px; border-radius: 50%; background: #ff1f45; }
  li b { color: #fff; font-weight: 600; }
  .foot { position: absolute; left: 82px; bottom: 40px; font-size: 14px; color: #6b6b70; }

  /* The real panel, scaled up so it reads at store size */
  .glass { position: absolute; border-radius: 12px; overflow: hidden;
    background: rgba(28,28,28,.92); box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08); }
  .glass iframe { display: block; width: 300px; border: 0; transform-origin: 0 0; }
  .side { right: 92px; top: 50%; }

  /* Shot 3: a player with the control bar */
  .player { position: absolute; left: 60px; top: 116px; width: 1160px; height: 640px; border-radius: 16px; overflow: hidden;
    background: radial-gradient(60% 80% at 30% 35%, #ff4d6d 0%, transparent 60%),
                radial-gradient(50% 70% at 75% 30%, #7c3aed 0%, transparent 65%),
                radial-gradient(70% 60% at 50% 100%, #f59e0b 0%, transparent 60%), #120a1a;
    box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .player::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 160px;
    background: linear-gradient(transparent, rgba(0,0,0,.75)); }
  .bars { position: absolute; left: 0; right: 0; bottom: 120px; height: 260px; display: flex; align-items: flex-end; justify-content: center; gap: 9px; opacity: .35; }
  .bars i { display: block; width: 10px; border-radius: 5px 5px 0 0; background: #fff; }
  .progress { position: absolute; z-index: 2; left: 16px; right: 16px; bottom: 58px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); }
  .progress b { display: block; width: 38%; height: 100%; border-radius: 2px; background: #ff1f45; }
  .progress u { position: absolute; left: 38%; top: 50%; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%; background: #ff1f45; }
  .ctl { position: absolute; z-index: 2; left: 8px; right: 8px; bottom: 6px; height: 48px; display: flex; align-items: center; color: #fff;
    font: 500 15px Roboto, Arial, sans-serif; }
  .ctl svg { width: 26px; height: 26px; fill: #fff; margin: 0 11px; }
  .time { margin-left: 8px; color: #eee; font-size: 15px; }
  .grow { flex: 1; }
  .fsbar { display: flex; align-items: center; height: 40px; border-radius: 20px; background: rgba(255,255,255,.14);
    box-shadow: 0 0 0 2px #ff1f45; margin-right: 8px; }
  .fsbar span { display: flex; align-items: center; justify-content: center; height: 40px; }
  .fsbar .pm { width: 44px; font-size: 28px; line-height: 1; padding-bottom: 3px; }
  .fsbar .sp { min-width: 60px; padding: 0 6px; font-size: 16px; font-variant-numeric: tabular-nums; }
  .inplayer { right: 20px; bottom: 76px; z-index: 3; }
  .call { position: absolute; z-index: 4; display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 600; color: #fff; }
  .call b { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%;
    background: #ff1f45; font-size: 18px; flex: none; }
  .top { position: absolute; left: 60px; right: 60px; top: 34px; display: flex; align-items: baseline; gap: 28px; }
  .top .eyebrow { margin: 0; }
  .top h1 { font-size: 44px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const shot = new URLSearchParams(location.search).get('shot') || '1';
  const root = document.getElementById('root');
  const panel = (cls, params, scale) =>
    `<div class="glass ${cls}" data-scale="${scale}"><iframe src="panel.html?${params}" scrolling="no"></iframe></div>`;
  const foot = '<div class="foot">Not affiliated with YouTube.</div>';

  if (shot === '1') {
    root.innerHTML = `<div class="left">
        <div class="eyebrow">for YouTube</div>
        <h1>Faster or slower.<br><em>Same pitch. In sync.</em></h1>
        <ul>
          <li><b>Music sound</b>: smooth for songs, no choppy notes</li>
          <li><b>0.5× to 4×</b>, no chipmunk voice</li>
          <li><b>Voice</b> sound for talking, or Auto picks per video</li>
          <li>Picture held back so lips stay in sync</li>
        </ul>
      </div>${foot}
      ${panel('side', 'speed=1.5&sound=music&bass=0&tail=0&reverb=0', 1.12)}`;
  } else {
    let bars = '', s = 11;
    for (let i = 0; i < 80; i++) { s = (s * 9301 + 49297) % 233280; bars += `<i style="height:${Math.round(30 + 230 * (s / 233280) * Math.sin(Math.PI * i / 80))}px"></i>`; }
    const I = {
      play: '<path d="M8 5v14l11-7z"/>',
      next: '<path d="M6 6l8.5 6L6 18zM16 6h2v12h-2z"/>',
      vol: '<path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/>',
      cc: '<path d="M19 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1zm7 0h-1.5v-.5h-2v3h2V13H18v1a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1z"/>',
      gear: '<path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7 7 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7 7 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7 7 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7 7 0 0 0 1.7-1l2.5 1 2-3.4zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/>',
      full: '<path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/>',
    };
    const ic = (k) => `<svg viewBox="0 0 24 24">${I[k]}</svg>`;
    root.innerHTML = `<div class="top"><div class="eyebrow">for YouTube</div><h1>Right in the player. <em>Nothing to set up.</em></h1></div>
      <div class="player">
        <div class="bars">${bars}</div>
        <div class="progress"><b></b><u></u></div>
        <div class="ctl">${ic('play')}${ic('next')}${ic('vol')}<span class="time">1:24 / 3:41</span><span class="grow"></span>
          <div class="fsbar"><span class="pm">−</span><span class="sp">1.25×</span><span class="pm">+</span></div>
          ${ic('cc')}${ic('gear')}${ic('full')}</div>
        ${panel('inplayer', 'speed=1.25&sound=music&bass=0&tail=0&reverb=0', 0.84)}
      </div>
      <div class="call" style="left:96px;top:calc(210px - 30px)"><b>1</b>It's on in every YouTube tab</div>
      <div class="call" style="left:96px;top:calc(262px - 30px)"><b>2</b>− / + change the speed by 0.25</div>
      <div class="call" style="left:96px;top:calc(314px - 30px)"><b>3</b>Click the speed for all settings</div>
      <div class="call" style="left:96px;top:calc(366px - 30px)"><b>4</b>Toolbar icon or Alt+Shift+S: on / off</div>
      <div class="foot" style="bottom:18px">Not affiliated with YouTube. The video picture is an example.</div>`;
  }

  // Size each panel to its content (the panel reports its height) and scale it.
  const frames = [...document.querySelectorAll('.glass')];
  addEventListener('message', (e) => {
    const h = e.data?.fasterSlowerHeight;
    if (!h) return;
    for (const g of frames) {
      const f = g.querySelector('iframe');
      if (f.contentWindow !== e.source) continue;
      const k = Number(g.dataset.scale);
      f.style.height = `${h}px`;
      f.style.transform = `scale(${k})`;
      g.style.width = `${300 * k}px`;
      g.style.height = `${h * k}px`;
      if (g.classList.contains('side')) g.style.marginTop = `${-h * k / 2}px`;
    }
  });
</script>
</body>
</html>
