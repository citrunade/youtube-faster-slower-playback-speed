<!doctype html>
<!-- Source for the Chrome Web Store promo tiles of both extensions.
     Open with ?brand=spotify|youtube&size=small|marquee; make-promo.ps1 renders all four PNGs. -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --accent: #1ed760; --accent2: #17b04e; --on-accent: #000; --glow: rgba(30,215,96,.22); }
  .youtube { --accent: #ff1f45; --accent2: #d90429; --on-accent: #fff; --glow: rgba(255,31,69,.22); }
  html, body { background: #0d0d0f; overflow: hidden; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI", Roboto, Arial, sans-serif; color: #f4f4f5; }
  .tile { position: relative; overflow: hidden;
    background: radial-gradient(120% 140% at 0% 0%, var(--glow), transparent 55%),
                radial-gradient(80% 120% at 100% 100%, rgba(255,255,255,.04), transparent 60%), #0d0d0f; }
  .marquee { width: 1400px; height: 560px; }
  .small { width: 440px; height: 280px; }

  /* Sound wave in the background */
  .wave { position: absolute; display: flex; align-items: center; gap: 7px; opacity: .16; }
  .wave i { display: block; width: 4px; border-radius: 2px; background: var(--accent); }

  .icon { display: block; border-radius: 24%; background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 80%, #fff), var(--accent2));
    box-shadow: 0 10px 40px var(--glow); }
  .eyebrow { color: var(--accent); font-weight: 600; letter-spacing: .2px; }
  h1 { font-weight: 800; letter-spacing: -1.5px; line-height: 1; }
  .tag { color: #c4c4c8; }

  /* Feature chips */
  .chips { display: grid; gap: 12px; }
  .chip { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); font-weight: 600; }
  .chip svg { flex: none; width: 22px; height: 22px; fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .chip.hot { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  .chip.hot svg { stroke: var(--on-accent); }

  /* Marquee layout */
  .marquee .left { position: absolute; left: 80px; top: 92px; width: 760px; }
  .marquee .brand { display: flex; align-items: center; gap: 22px; }
  .marquee .icon { width: 92px; height: 92px; }
  .marquee .eyebrow { font-size: 24px; margin-bottom: 6px; }
  .marquee h1 { font-size: 76px; }
  .marquee .tag { font-size: 26px; margin: 22px 0 28px; }
  .marquee .chips { grid-template-columns: 1fr 1fr; font-size: 20px; }

  /* Settings panel mock */
  .panel { position: absolute; right: 80px; top: 50%; transform: translateY(-50%); width: 400px; padding: 24px 26px;
    border-radius: 22px; background: rgba(30,30,34,.94); border: 1px solid rgba(255,255,255,.09);
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.4); }
  .row { display: flex; align-items: baseline; justify-content: space-between; }
  .lbl { font-size: 15px; font-weight: 600; color: #a1a1a8; text-transform: uppercase; letter-spacing: 1px; }
  .big { font-size: 46px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .val { font-size: 16px; font-weight: 600; color: #e4e4e7; font-variant-numeric: tabular-nums; }
  .track { position: relative; height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); margin: 10px 0 4px; }
  .track b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
  .track u { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .presets { display: flex; gap: 6px; margin-top: 12px; }
  .presets span { flex: 1; text-align: center; padding: 6px 0; border-radius: 8px; background: rgba(255,255,255,.07);
    color: #a1a1a8; font-size: 14px; font-weight: 600; }
  .presets span.on { background: var(--accent); color: var(--on-accent); }
  .seg { display: flex; gap: 3px; padding: 3px; margin-top: 10px; border-radius: 10px; background: rgba(255,255,255,.07); }
  .seg span { flex: 1; text-align: center; padding: 7px 0; border-radius: 8px; font-size: 15px; font-weight: 600; color: #a1a1a8; }
  .seg span.on { background: rgba(255,255,255,.16); color: #fff; }
  .sep { height: 1px; background: rgba(255,255,255,.08); margin: 18px 0 14px; }
  .fx { display: grid; gap: 12px; }
  .fx .row { align-items: center; }
  .fx .lbl { text-transform: none; letter-spacing: 0; font-size: 16px; color: #d4d4d8; width: 92px; }
  .fx .track { flex: 1; margin: 0 14px; }
  .switch { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 16px; font-weight: 600; color: #d4d4d8; }
  .switch i { position: relative; width: 38px; height: 22px; border-radius: 11px; background: var(--accent); }
  .switch i.off { background: rgba(255,255,255,.18); }
  .switch i.off::after { right: auto; left: 3px; }
  .switch i::after { content: ""; position: absolute; right: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }

  /* Small tile layout */
  .small .icon { position: absolute; left: 28px; top: 26px; width: 56px; height: 56px; }
  .small .eyebrow { position: absolute; left: 98px; top: 30px; font-size: 15px; }
  .small h1 { position: absolute; left: 98px; top: 52px; font-size: 33px; letter-spacing: -.8px; }
  .small .hero { position: absolute; left: 28px; top: 104px; display: flex; align-items: baseline; gap: 12px; }
  .small .hero b { font-size: 64px; font-weight: 800; color: var(--accent); letter-spacing: -2px; line-height: 1; }
  .small .hero span { font-size: 19px; font-weight: 600; color: #e4e4e7; line-height: 1.15; }
  .small .chips { position: absolute; left: 28px; right: 28px; bottom: 26px; display: flex; gap: 6px; font-size: 14px; white-space: nowrap; }
  .small .chip { padding: 8px 10px; gap: 6px; border-radius: 10px; }
  .small .chip svg { width: 17px; height: 17px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const q = new URLSearchParams(location.search);
  const brand = q.get('brand') === 'youtube' ? 'youtube' : 'spotify';
  const size = q.get('size') === 'small' ? 'small' : 'marquee';
  const yt = brand === 'youtube';

  // Simple line icons (24×24)
  const I = {
    speed: '<path d="M4 15a8 8 0 1 1 16 0"/><path d="M12 15l4.5-5"/>',
    pitch: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
    voice: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
    film: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/>',
    phone: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
    sliders: '<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
    tape: '<rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="12" r="2.5"/><circle cx="16" cy="12" r="2.5"/><path d="M8 14.5h8"/>',
    heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  };
  const svg = (k) => `<svg viewBox="0 0 24 24">${I[k]}</svg>`;
  const chip = (k, t, hot) => `<div class="chip${hot ? ' hot' : ''}">${svg(k)}${t}</div>`;
  const iconSvg = `<svg viewBox="0 0 100 100" width="100%" height="100%"><g fill="${yt ? '#fff' : '#000'}">
      <rect x="16" y="33" width="27" height="8" rx="4"/><rect x="16" y="46" width="27" height="8" rx="4"/><rect x="16" y="59" width="27" height="8" rx="4"/>
      <path d="M50 26.5a3 3 0 0 1 4.6-2.5l29 23.5a3 3 0 0 1 0 4.8l-29 23.5a3 3 0 0 1-4.6-2.5z"/></g></svg>`;

  const F = yt ? {
    eyebrow: 'for YouTube',
    tag: 'Faster or slower, at the original pitch, smooth enough for music.',
    chips: [['pitch', 'Music sound: smooth for songs', true], ['speed', 'Up to 4× speed'], ['film', 'Picture kept in sync'],
            ['phone', 'Works on Shorts'], ['sliders', 'Bass, reverb, drum tail'], ['voice', 'Voice sound for talking']],
    speed: 1.5, max: 4, presets: ['1', '1.25', '1.5', '2', '3', '4'],
    small: { hero: '4×', line: 'faster or slower,<br>smooth for music', chips: [['pitch', 'Music sound'], ['phone', 'Shorts'], ['film', 'In sync']] },
  } : {
    eyebrow: 'for the Spotify web player',
    tag: 'Speed up or slow down. Same pitch, smooth sound.',
    chips: [['pitch', 'Original pitch, no chipmunks', true], ['tape', 'Tape mode: slowed + reverb'], ['sliders', 'Bass, reverb, drum tail'],
            ['heart', 'Per-song settings'], ['speed', '0.5× to 2×, live'], ['clock', 'Recently played list']],
    speed: 1.25, max: 2, presets: ['0.75', '0.85', '1', '1.1', '1.25', '1.5'],
    small: { hero: '1.25×', line: 'Same pitch,<br>smooth sound', chips: [['clock', 'Recently played'], ['sliders', 'Bass, reverb'], ['heart', 'Per song']] },
  };

  const pct = (v, lo, hi) => `${((v - lo) / (hi - lo)) * 100}%`;
  const slider = (p) => `<div class="track"><b style="width:${p}"></b><u style="left:${p}"></u></div>`;
  const fx = (l, p, v) => `<div class="row"><span class="lbl">${l}</span>${slider(p)}<span class="val">${v}</span></div>`;

  const panel = `<div class="panel">
      <div class="row"><span class="lbl">Speed</span><span class="big">${F.speed}×</span></div>
      ${slider(pct(F.speed, 0.5, F.max))}
      <div class="presets">${F.presets.map((p) => `<span class="${Number(p) === F.speed ? 'on' : ''}">${p}</span>`).join('')}</div>
      <div class="sep"></div>
      ${yt
        ? `<div class="row"><span class="lbl">Sound</span></div>
           <div class="seg"><span>Auto</span><span class="on">Music</span><span>Voice</span></div>`
        : `<div class="row"><span class="lbl">Pitch</span><span class="val">Original</span></div>
           <div class="switch"><i class="off"></i>Tape mode (pitch follows speed)</div>`}
      <div class="sep"></div>
      <div class="fx">${fx('Bass', '55%', '+6 dB')}${fx('Reverb', '35%', '35%')}${fx('Drum tail', '25%', '25%')}</div>
    </div>`;

  const wave = (n, h, seed) => {
    let s = seed, out = '';
    for (let i = 0; i < n; i++) { s = (s * 9301 + 49297) % 233280; const r = s / 233280; out += `<i style="height:${Math.round(h * (0.15 + 0.85 * r * Math.sin(Math.PI * i / n)))}px"></i>`; }
    return out;
  };

  const root = document.getElementById('root');
  root.className = `tile ${size} ${brand}`;
  document.body.className = brand;
  if (size === 'marquee') {
    root.innerHTML = `<div class="wave" style="left:620px;top:30px;height:500px">${wave(70, 460, 7)}</div>
      <div class="left">
        <div class="brand"><span class="icon">${iconSvg}</span><div><div class="eyebrow">${F.eyebrow}</div><h1>Faster / Slower</h1></div></div>
        <p class="tag">${F.tag}</p>
        <div class="chips">${F.chips.map((c) => chip(...c)).join('')}</div>
      </div>${panel}`;
  } else {
    root.innerHTML = `<div class="wave" style="right:-10px;top:20px;height:240px;gap:5px">${wave(30, 220, 3)}</div>
      <span class="icon">${iconSvg}</span><div class="eyebrow">${F.eyebrow}</div><h1>Faster / Slower</h1>
      <div class="hero"><b>${F.small.hero}</b><span>${F.small.line}</span></div>
      <div class="chips">${F.small.chips.map((c) => chip(...c)).join('')}</div>`;
  }
</script>
</body>
</html>
